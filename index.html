<title>Parque Mitre</title>
<style>

    --line:#DBD6C9; --accent:#F5A800; --accent-ink:#8A6100; --on-accent:#1C1B14;
    --ok:#2E7D4F; --ok-bg:#E2EFE7; --warn:#8A6100; --warn-bg:#F7ECD2; --crit:#B03A20; --crit-bg:#F6E2DC;
    --chip:#EFECE3; --shadow:0 1px 3px rgba(35,33,28,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1A15; --surface:#24221B; --surface2:#2D2A21; --ink:#EFECE2; --muted:#A6A090;
      --line:#3B372B; --accent:#F5A800; --accent-ink:#F2BB3F; --on-accent:#1C1B14;
      --ok:#63BD8C; --ok-bg:#22352A; --warn:#E3AC3F; --warn-bg:#3A3323; --crit:#E27052; --crit-bg:#402620;
      --chip:#2D2A21; --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1A15; --surface:#24221B; --surface2:#2D2A21; --ink:#EFECE2; --muted:#A6A090;
    --line:#3B372B; --accent:#F5A800; --accent-ink:#F2BB3F; --on-accent:#1C1B14;
    --ok:#63BD8C; --ok-bg:#22352A; --warn:#E3AC3F; --warn-bg:#3A3323; --crit:#E27052; --crit-bg:#402620;
    --chip:#2D2A21; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  .hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,#1C1B14 14px 28px)}
  header{background:var(--surface);border-bottom:1px solid var(--line)}
  .head-in{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{background:var(--accent);color:var(--on-accent);font-weight:800;letter-spacing:.08em;
    padding:6px 10px;font-size:15px}
  .head-t h1{margin:0;font-size:19px;letter-spacing:.01em}
  .head-t p{margin:0;color:var(--muted);font-size:12.5px}
  .demo-tag{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    border:1px dashed var(--line);padding:3px 8px;border-radius:3px}
  nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .nav-in{max-width:1100px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
  .nav-in button{
    appearance:none;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;
    padding:11px 14px 9px;font:600 13.5px/1 inherit;font-family:inherit;color:var(--muted);white-space:nowrap}
  .nav-in button.on{color:var(--ink);border-bottom-color:var(--accent)}
  .nav-in button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
  h2{font-size:16px;margin:26px 0 10px;letter-spacing:.01em}
  h2:first-child{margin-top:0}
  .sub{color:var(--muted);font-size:13px;margin:-6px 0 14px}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:var(--shadow)}
  .kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .kpi.crit .n{color:var(--crit)} .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--ok)}
  /* cards / lists */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
  .alert-row{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
  .alert-row:first-child{border-top:none}
  .alert-row:hover{background:var(--surface2)}
  .sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
  .sev.crit{background:var(--crit)} .sev.warn{background:var(--accent)}
  .alert-row b{font-size:14px}
  .alert-row .d{color:var(--muted);font-size:12.5px}
  .alert-row .who{margin-left:auto;text-align:right;flex:none}
  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:99px}
  .pill.crit{background:var(--crit-bg);color:var(--crit)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.na{background:var(--chip);color:var(--muted)}
  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filters select,.filters input,select,input,textarea{
    background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    padding:8px 10px;font:14px inherit;font-family:inherit}
  .filters input{flex:1;min-width:160px}
  select:focus-visible,input:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  /* table */
  .twrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
  th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;
    padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
  td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface2)}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12.5px}
  .interno{font-weight:700}
  /* ficha */
  .back{background:none;border:none;color:var(--accent-ink);font:600 13.5px inherit;font-family:inherit;cursor:pointer;padding:0;margin-bottom:12px}
  .ficha-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--line)}
  .ficha-head .ic{width:52px;height:52px;flex:none;border-radius:6px;background:var(--accent);color:var(--on-accent);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .ficha-head h3{margin:0 0 2px;font-size:18px}
  .meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  @media(max-width:760px){.fgrid{grid-template-columns:1fr}}
  .fcol{padding:16px;border-top:1px solid var(--line)}
  .fcol+.fcol{border-left:1px solid var(--line)}
  @media(max-width:760px){.fcol+.fcol{border-left:none}}
  .fcol h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .plan{margin-bottom:14px}
  .plan .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
  .bar i.warn{background:var(--accent)} .bar i.crit{background:var(--crit)}
  .doc{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .doc:last-child{border-bottom:none}
  /* timeline */
  .tl{list-style:none;margin:0;padding:0 16px 16px;border-top:1px solid var(--line)}
  .tl li{position:relative;padding:12px 0 12px 26px;border-bottom:1px dashed var(--line)}
  .tl li:last-child{border-bottom:none}
  .tl li::before{content:"";position:absolute;left:6px;top:19px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:2px solid var(--surface)}
  .tl li.crit::before{background:var(--crit)}
  .tl .when{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tl .cost{float:right;font-variant-numeric:tabular-nums;font-weight:600}
  .tl .by{color:var(--muted);font-size:12.5px}

  .phone .ph-head{background:var(--accent);color:var(--on-accent);padding:12px 16px;font-weight:800}
  .phone .ph-head small{display:block;font-weight:600;opacity:.75}
  .phone form{padding:16px;display:flex;flex-direction:column;gap:12px}
  .phone label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{flex:1;border:none;background:var(--surface);padding:9px;font:600 13px inherit;font-family:inherit;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  textarea{width:100%;resize:vertical}
  input[type=number],select{width:100%}
  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;

  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){#toast{transition:none}}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px}

  .subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .subtabs button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:99px;padding:6px 14px;font:600 12.5px inherit;font-family:inherit;cursor:pointer}
  .subtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  details.wk{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);margin-bottom:10px}
  details.wk summary{cursor:pointer;font-weight:700;padding:12px 16px;font-size:14.5px;list-style-position:inside}
  details.wk summary .tag{float:right;font-weight:600;font-size:11px;color:var(--muted)}
  details.wk .bd{padding:0 18px 16px;font-size:13.5px}
  .wk-h{margin:14px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
  details.wk ul{margin:4px 0;padding-left:20px}
  details.wk li{margin-bottom:3px}
  .seg3{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex:none}
  .seg3 button{border:none;background:var(--surface);padding:6px 10px;font:700 11.5px inherit;font-family:inherit;color:var(--muted);cursor:pointer}

  .seg3 button.na.on{background:var(--chip);color:var(--ink)}
  .chk-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:13.5px}
  .chk-row:first-of-type{border-top:none}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
  .uso-in{width:100px}
  .cierre{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--surface2);border-top:1px solid var(--line);width:100%}
  .cierre label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
</style>

/* Plan preventivo por defecto según tipo de bien (respaldado por la wiki de abajo) */
function planPara(p) {
  const c = (p.clas || '').toUpperCase(), m = (p.modelo || '').toUpperCase();
  if (c.includes('MIEXCAVADORA') || (c.includes('EXCAVADORA') && /E-?35|E-?50|EZ ?53/.test(m))) return { intervalo: 250, tipo: 'Miniexcavadora' };
  if (c.includes('EXCAVADORA')) return { intervalo: 500, tipo: 'Excavadora' };
  if (c.includes('CARGADOR')) return { intervalo: 500, tipo: 'Cargador frontal' };
  if (c.includes('COMPRESOR') || c.includes('GRUPO')) return { intervalo: 250, tipo: 'Grupo/Compresor' };
  if (c.includes('MARTILLO') && p.cat === 'ACC') return { intervalo: 600, tipo: 'Martillo hidráulico (resellado)' };
  if (p.cat === 'CAM') return { intervalo: 15000, tipo: 'Camión (uso severo obra)' };
  if (p.cat === 'CV') return { intervalo: 10000, tipo: 'Camioneta' };
  if (p.cat === 'AU') return { intervalo: 10000, tipo: 'Auto' };
  if (p.cat === 'MO') return { intervalo: 3000, tipo: 'Moto' };
  return null;
}

    clas: p.clas, desc: p.desc, dominio: p.dom, resp: p.resp,

});

{ ...{"titulo": "Doosan DX225LCA (flota principal, 4 unidades)", "plan": ["<b>Diario (10 hs):</b> niveles, decantar prefiltro de gasoil, indicador de filtro de aire, engrase de TODOS los pines del frente (en demolición), tensión de cadenas, pérdidas.", "<b>250 hs:</b> aceite motor + filtro (el DB58TIS admite 500 con filtro de alta capacidad; en polvo de demolición la práctica es 250), engrase de corona y piñón de giro, limpieza de filtro primario de aire.", "<b>500 hs:</b> filtros de combustible primario y secundario; limpieza de radiadores con aire (en demolición: semanal o diaria).", "<b>1.000 hs:</b> filtro de retorno hidráulico (<b>con martillo: 500 hs o menos</b>), filtro piloto y respiradero, aceite de reductor de giro y mandos finales (primer cambio a 500).", "<b>2.000 hs:</b> aceite hidráulico completo con colador (<b>con martillo ≥50%: 1.000 hs</b>), refrigerante (2 años), regulación de válvulas.", "<b>4–5.000 hs:</b> presiones patrón de bomba, motores de giro/traslación, set de mangueras del martillo, medición de desgaste de rodaje."], "fallas": ["Motor que se ahoga al exigir el brazo (típico DX225LCA): calibración bomba-motor (EPOS), entrega de combustible, filtros.", "Baja presión hidráulica generalizada con horas: desgaste de bomba principal, presión piloto, alivios descalibrados.", "Vibración/traqueteo hidráulico (caso resuelto con inyectores), joysticks erráticos, recalentamiento por radiadores tapados de polvo.", "Repuestos Doosan con demoras: mantener stock propio de filtros, sellos y mangueras."], "practicas": ["Con 4 unidades gemelas: análisis de aceite (motor, hidráulico, mandos) cada 250–500 hs comparando entre máquinas — detecta el desgaste de bomba antes de la falla."], "checks": [], "fuentes": 10}, match: b => b.cat === 'MAQ' && /DOOSAN/i.test(b.modelo) },
{ ...{"titulo": "Sany SY135C / SY215C y Komatsu PC200-8", "plan": ["<b>Sany:</b> aceite motor + filtro a 500 hs (Cummins QSB del SY215C: <b>con gasoil de azufre alto, 250 hs</b>); filtros hidráulicos a 1.000; aceite hidráulico a 2.000 (<b>con martillo: 1.000</b>). El manual Sany reconoce el martillo como uso severo: el servicio del circuito pasa de anual a cada 6 meses.", "<b>Komatsu PC200-8:</b> aceite motor + filtro 500 hs (gasoil con azufre >0,2%: 250); prefiltro de combustible 500, filtro principal 1.000; filtro de retorno hidráulico 1.000 — <b>la tabla de martillo del manual lo baja hasta 100–250 hs con uso intensivo</b>; aceite hidráulico 5.000 SOLO con aceite genuino y sin martillo → <b>con ~50% martillo: 2.000–2.500; intensivo: 1.000–1.500</b>; mandos finales 2.000; válvulas a 4.000."], "fallas": ["SY135C: motor que 'se cae' tras 20–30 min y se recupera parado — entrega de combustible (bomba, filtros, venteo) o recalentamiento.", "Sany: sensores/conectores es el rubro flojo (limpiar masas con dieléctrico); mangueras originales desiguales — reemplazar por calidad al primer recambio. Estructura y soldadura: robustas.", "PC200-8: el punto débil n.º 1 es el <b>common rail Denso</b> — inyectores y sensor de riel mueren por agua/impurezas en el gasoil: doble filtrado, drenaje diario del separador, considerar filtro extra de 2–5 μm. Motor que se apaga al girar bajo carga: presóstatos detrás de cabina. Mejor disponibilidad de repuestos del lote."], "practicas": [], "checks": [], "fuentes": 9}, match: b => b.cat === 'MAQ' && /SANY|KOMATSU/i.test(b.modelo) },
{ ...{"titulo": "Miniexcavadoras Bobcat E35 / E50 y Wacker Neuson EZ53", "plan": ["Bobcat: <b>primer cambio de aceite de mandos finales y filtro case drain a las 50 hs</b> (máquina nueva — existe kit oficial); aceite motor Kubota 250–500 hs (en polvo: 250); <b>filtro hidráulico + respiradero + case drain juntos cada 500 hs</b>; aceite de mandos finales (SAE 90 GL-5) cada 1.000 hs o anual; hidráulico 1.000–2.000 (<b>con martillo: 500–1.000</b>).", "Wacker EZ53: engrase completo semanal (50 hs) incl. corona; aceite motor 250–500; filtros hidráulicos 500; hidráulico y reductores de traslación a 1.000 hs o anual."], "fallas": ["E35: falla de motor de traslación por <b>filtro case drain tapado</b> (la presión de retorno revienta el sello del mando final) — la causa n.º 1 documentada; rodamiento principal; sensores.", "E50: bloqueos de aire en combustible si se queda sin gasoil (purga + códigos); pulgar hidráulico que no cierra.", "EZ53 recientes con DPF: el ciclo demolición (ralenti + baja carga) lo tapa — completar regeneraciones, evitar ralenti largo. Poca base instalada = repuestos lentos.", "Minis en demolición: no montar martillo sobredimensionado (daña pluma y corona); orugas de goma sufren el hierro — evaluar tejas híbridas."], "practicas": [], "checks": [], "fuentes": 8}, match: b => b.cat === 'MAQ' && /BOBCAT|WACKER/i.test(b.modelo) },
{ ...{"titulo": "Volvo L110F (cargador frontal)", "plan": ["Aceite motor + filtro 500 hs (1.000 solo con aceite VDS-4.5 y filtros larga vida — en polvo mantener 500). Filtro de cabina cada 250 hs o menos (el operador respira polvo de hormigón).", "Transmisión: aceite + filtro a 1.000 hs; ejes con frenos húmedos: aceite a 2.000 hs; hidráulico 2.000 hs; refrigerante VCS amarillo — NUNCA mezclar con verde; válvulas del D6E a 2.000.", "Volvo es estricto con sus especificaciones propias (VDS-4.5, WB101, 97304): respetarlas o se pierde la vida útil de transmisión y ejes."], "fallas": ["Transmisión: 'gear shift reduced check' / pérdida intermitente de marcha — presión/sensores del TCU, conexiones eléctricas; fluido contaminado lo agrava (las transmisiones L110 son ítem habitual de remanufactura).", "D6E: sensor de presión de riel y pérdida de potencia — fix de campo documentado: retorquear las abrazaderas de inyectores (inyector flojo mete gases al riel).", "En demolición: cortes de neumáticos por hierro — inspección diaria; evaluar relleno de espuma o cadenas."], "practicas": [], "checks": [], "fuentes": 6}, match: b => b.cat === 'MAQ' && /VOLVO/i.test(b.modelo) },
{ ...{"titulo": "Reglas de oro en demolición: martillo, rodaje, polvo y lubricantes", "plan": [], "fallas": [], "practicas": ["<b>Martillo hidráulico: engrase cada 2 horas de trabajo con pasta para cincel</b> (moly/cobre — nunca grasa común: no aguanta la temperatura del buje), siempre en vertical con el peso apoyado en la herramienta. Prohibido: golpes en vacío, palanquear con el cincel, más de 15–30 s en el mismo punto. Nitrógeno: control cada 100–250 hs de martillo. Con jornadas de 8–10 hs conviene lubricador automático.", "<b>Aceite hidráulico y filtros del portador: mitad de intervalo con martillo ≥50% del tiempo</b> — es la regla más repetida en todas las fuentes.", "<b>Rodaje:</b> limpieza diaria al fin de jornada (el polvo de hormigón compactado desgasta bujes y sellos; el hierro corta sellos de rodillos); tensión de cadena cada 10–15 hs; medición formal de desgaste cada 1.000–2.000 hs.", "<b>Polvo:</b> soplado de radiadores semanal (diario con corte/hidrodemolición) — el recalentamiento crónico es la causa raíz de media flota; filtro de aire por indicador de restricción, nunca limpiar el elemento interno; filtros de cabina cada 250 hs (el sílice es salud ocupacional).", "<b>Lubricantes (equivalencias locales):</b> motor 15W-40 CI-4/CJ-4 (Shell Rimula R4X / YPF Extravida XV); hidráulico ISO VG 46 HV (VG 68 en verano; Tellus S2V / YPF Hidráulico BP); mandos y giro SAE 80W-90 GL-5 EP; grasa EP2 litio para pines + pasta de cincel para el martillo. No mezclar marcas de hidráulico sin flush. El intervalo de 5.000 hs de Komatsu solo vale con aceite genuino.", "Arranque: 5 min de calentamiento (hidráulico frío + martillo = daño de bomba). Fin de jornada: tanque de gasoil lleno (evita condensación), limpieza de rodaje, posición de estacionamiento."], "checks": ["Check diario del operador (5 min): vuelta perimetral (pérdidas, fisuras en pluma/brazo/portamartillo, dientes, pasadores con traba) · niveles · drenaje del separador de agua (obligatorio diario con gasoil de obra) · indicador del filtro de aire + válvula de polvo · tensión de cadena y hierro clavado · engrase de pines del frente · mirada a los panales del radiador · mangueras del martillo · en cabina: anotar horómetro, luces, alarma de traslación, códigos en monitor, matafuegos."], "fuentes": 12}, match: b => b.cat === 'MAQ' && /EXCAVADORA|CARGADOR/i.test(b.clas || '') },
{ ...{"titulo": "Martillos hidráulicos (Indeco, Soosan, Krupp, Epiroc, Daemo, Brokk BHB155)", "plan": ["<b>Engrase cada 2 hs de uso efectivo (cada 1 h con polvo de hormigón)</b>: 5–10 bombeadas de pasta para cincel con la herramienta apoyada y presionada. Con autolube (ContiLube/Daemo): verificar a diario que el cartucho tenga producto — un autolube vacío es un martillo sin grasa.", "<b>Nitrógeno: control semanal</b> (o cada 40–50 hs) y siempre tras un resellado. Culata típica 14–17 bar (Soosan SQ: 15,5 kg/cm² a 0 °C → 17,5 a 40 °C — ajustar en cambio de estación). Solo nitrógeno seco, nunca aire. Indeco: revisar sello de gas cada 600–800 hs.", "<b>Bujes y herramienta: medición semanal</b>. Holgura nueva 0,15–0,25 mm; a 1 mm conviene cambiar el buje; límite duro típico 5–8 mm. Herramienta: descartar al diámetro mínimo de placa, ante hongo o quemado azul (el hongo se amola en frío; nunca soldar una herramienta templada). Re-torquear tirantes: uno flojo corta a los otros tres.", "<b>Resellado cada 600–1.000 hs de percusión</b> (demolición con polvo: 800–1.200); overhaul completo cada 1.000–3.000 hs. Planificación para uso diario: <b>1 resellado + 1 juego de bujes + 2–4 herramientas por año por martillo activo</b>.", "Aceite hidráulico del portador: <b>mitad de intervalo</b> con uso intensivo; temperatura máxima 80 °C; limpieza objetivo ISO 4406 20/18/15 o mejor."], "fallas": ["Rotura de pistón ← bujes vencidos o falta de grasa (la reparación más cara). Rotura de herramienta ← palanqueo o golpe en vacío. Tirantes cortados ← falta de re-torqueo. Diafragma roto ← N2 incorrecto. Sellos quemados ← aceite >80 °C."], "practicas": ["Perpendicular a la superficie, precarga con el peso del brazo, reposicionar cada 15–30 s si no rompe, nunca golpear en vacío, tapar los acoples al desmontar."], "checks": [], "fuentes": 17}, match: b => /MARTILLO/i.test(b.clas || '') },
{ ...{"titulo": "Mordazas, pulverizadores y cizallas (Atlas Copco, Indeco JRP, Trevi Benne, Daemo)", "plan": ["Engrase de todos los pivotes por turno (perno principal cada 4 hs en uso intensivo) — la grasa además expulsa el polvo abrasivo de pernos y bujes.", "Giro 360°: grasa del rodamiento de corona cada 50–100 hs y del dentado cada 8 hs, girando mientras se engrasa; <b>controlar el torque de los tornillos de la corona</b> (su aflojamiento es falla catastrófica).", "Cuchillas: verificar torque de tornillos por turno/semana (una cuchilla floja destruye el alojamiento); mantener el gap de corte con sonda y suplementos; rotar las cuchillas reversibles antes de que se redondeen; recargue por soldadura solo con procedimiento del fabricante.", "Diario: fisuras en mandíbulas, cuello y orejetas; mangueras; juego del perno principal."], "fallas": ["Fisuras por fatiga en mandíbulas/orejetas, cuchillas caídas por torque no verificado, corona seca, mangueras cortadas por hierro, sobrecarga por cortar en la garganta incorrecta (cortar siempre lo más adentro de la boca)."], "practicas": [], "checks": [], "fuentes": 8}, match: b => /MORDAZA|CIZALLA|PULVERIZADOR/i.test(b.clas || '') },
{ ...{"titulo": "Hidrogrúa Palfinger PK-42502 (normativa e inspecciones)", "plan": ["<b>Cada 50 hs o mensual:</b> engrase completo — columna con la pluma elevada al máximo (así la grasa llega al rodamiento de giro), correderas de prolongas con grasa MoS2, pernos, cremallera de giro.", "<b>Anual:</b> inspección documentada por personal calificado (IRAM 3927: intervalos de 1 a 12 meses según severidad) con verificación del limitador de momento y válvulas de sobrecentro; práctica de mercado exigida por ARTs: informe firmado por profesional + ensayo de carga + tintas penetrantes en ganchos y soldaduras críticas.", "Marco legal: Ley 19.587 + Decreto 911/96 (aparatos elevadores: registro de mantenimiento, operadores autorizados, gancho con traba). La Res. SRT 960/15 es SOLO para autoelevadores — no usarla como marco de la hidrogrúa.", "Pre-uso diario: niveles, mangueras, gancho y pestillo, estabilizadores y trabas, parada de emergencia, bulonería de fijación al chasis (re-torquear tras las primeras 50 hs)."], "fallas": ["Rodamiento de columna seco (juego/ruido), tacos de prolongas gastados por falta de grasa, válvulas de sobrecentro descalibradas (la pluma 'cede'), fisuras en orejetas de estabilizadores, bulones de montaje flojos."], "practicas": [], "checks": [], "fuentes": 7}, match: b => /HIDROGRUA/i.test(b.clas || '') },
{ ...{"titulo": "Grupos electrógenos y compresores (Sullair 185, Chicago Pneumatic)", "plan": ["Grupos: service de <b>250 hs o 6 meses</b> (aceite + filtros de aceite y combustible SIEMPRE); mensual: arranque con carga ≥30% durante 30 min (evita el carbonizado por baja carga); anual: banco de carga al 80–100% y calibración de válvulas.", "Compresores Sullair: kits oficiales a 50 (inicial), 250 (aceite motor), 500 (filtros combustible + muestreo) y <b>1.500 hs (fluido del compresor, filtro y separador aire/aceite)</b>."], "fallas": ["Grupos: baterías (causa n.º 1 de no-arranque), gasoil con agua/bacteria en tanques de obra, radiador tapado de polvo, AVR quemado por bornes flojos (termografía del tablero lo anticipa).", "Compresores: separador saturado (arrastra aceite al aire y mata los martinetes neumáticos), válvula de admisión pegada, sobretemperatura por radiador sucio."], "practicas": [], "checks": [], "fuentes": 8}, match: b => b.cat === 'EQU' || /COMPRESOR/i.test(b.clas || '') },
{ ...{"titulo": "Mercedes-Benz Axor / Atego / Accelo (y 1624, 2423K)", "plan": ["Aceite motor + filtro (MB 228.3, 15W-40): volcadores en obra <b>15.000–20.000 km o 350 hs o 6 meses</b>, lo que ocurra primero (plan oficial Axor 3131 severo = 350 hs; Atego severo = 300 hs). Tractores en ruta: 30.000–45.000 km.", "Filtro de gasoil + separador de agua en cada service; <b>filtro de salida de tanque: limpieza en cada service y cambio cada 700 hs</b> (plan oficial). Purga del separador semanal.", "Filtro de aire por indicador de restricción; en demolición inspección semanal y cambio típico a 500–700 hs. No soplarlo más de 1–2 veces.", "Caja y diferenciales: en obra <b>60.000 km o anual</b> (o por análisis de aceite, que es lo que pide MB). Accelo plan oficial severo: 1º a 15.000, 2º a 60.000, luego cada 45.000 km.", "Frenos de leva/campana en volcadores: regulación y cintas en cada service (el desgaste en obra es 2–3× ruta). Purga de tanques de aire diaria; cartucho del secador de aire <b>anual</b> en uso severo.", "Refrigerante MB 325/326 al 50%: control en cada service, cambio cada 3 años. Correas poly-V con tensor cada ~2.000 hs.", "1624 / 2423K viejos (OM 366/447): aceite cada 10.000–15.000 km máximo, reglaje de válvulas cada 60–80.000 km, bomba en línea calibrada cada ~150.000 km, engrase manual crítico."], "fallas": ["Axor: caja automatizada que se recalienta y 'no toma cambios' o queda en modo manual; tras cambiar el embrague hay que reajustar el servo y reprogramar el recorrido (falla típica si no se hace). Pérdida de potencia por pedal/sensor; tablero muerto por masas/CAN.", "Accelo: <b>cristalización de urea (SCR/AdBlue)</b> con 'limitado en su uso' — típico del arranque-parada urbano; usar AdBlue certificado y revisar el inyector de urea en cada service. Caja que no engrana por comando electrónico; 'imposible arranque' en tablero.", "Atego/viejos: soportes de cabina y elásticos castigados en obra; en OM 366: bomba inyectora y tapa de cilindros por recalentamiento."], "practicas": [], "checks": [], "fuentes": 18}, match: b => b.cat === 'CAM' && /MERCEDES/i.test(b.modelo) },
{ ...{"titulo": "Scania P380 8x4 y G440 (DC13, Opticruise, Retarder)", "plan": ["Esquema Scania en escalones de 15.000 km; para 'tráfico de construcción' queda en <b>15.000–20.000 km o 500 hs</b> de aceite + filtros. El plan flexible con telemetría (hasta 155.000 km) es solo para larga distancia liviana — jamás para volcadores de obra.", "Caja GRS + Opticruise: aceite STO en obra <b>60.000 km o anual</b>; leer códigos de autodiagnóstico en cada service.", "Retarder: aceite + filtro propio cada <b>120.000 km o 2 años</b> (antes si trabaja en pendiente con carga).", "Calibración de válvulas e inyectores XPI: en los módulos mayores (~90–120.000 km / 2.000 hs en obra)."], "fallas": ["Retarder: electroválvulas y sensor de temperatura, aceite vencido. Opticruise: desgaste de embrague si se maniobra lento sin usar el modo maniobra.", "Inyectores XPI muy sensibles al agua en el gasoil: el separador tiene que estar impecable.", "En 8x4 de obra: bujes de elásticos delanteros dobles, fuelles y ballestas son consumibles."], "practicas": [], "checks": [], "fuentes": 8}, match: b => b.cat === 'CAM' && /SCANIA/i.test(b.modelo) },
{ ...{"titulo": "VW 13.180, Ford F-14000 y furgones (Vito, Master, Kangoo, Daily)", "plan": ["VW 13.180 (MWM/Cummins): aceite en obra <b>10.000–15.000 km o 250–300 hs</b>; caja Eaton 50.000 km severo; diferencial Meritor 50.000 km (85W-140 en obra); ajuste de recorrido de embrague en cada service.", "Ford F-14000 (Cummins 6BT): cárter chico — <b>aceite cada 10.000–12.000 km o 250 hs, nunca más de 15.000</b>; trampa de agua en cada cambio (bomba rotativa sensible al gasoil sucio); reglaje de válvulas cada 2.000 hs.", "Furgones (Vito 111, Master, Kangoo, Daily 70.12): aceite <b>10.000 km o 1 año</b> en uso urbano de obra; correa de distribución Master/Kangoo dCi a 90–120.000 km o 5 años con bomba de agua; Vito y Daily llevan cadena; pastillas 20–30.000 km cargados."], "fallas": ["6BT: presión de aceite baja por desgaste, ruido de distribución, fisuras de múltiple — candidato a mantener por condición con análisis de aceite semestral (repuestos baratos y abundantes).", "Vito OM646: el 'black death' (fuga por sello de inyector que carboniza la culata) — revisar asientos de inyectores en cada service; EGR y admisión con carbonilla.", "Master: embrague (punto débil clásico), turbo/inyección, EGR, sobrecalentamiento por electroventilador. Kangoo 1.5 dCi: arranque entre 80–120.000 km (precalentadores), inyectores. Daily 8140: bomba inyectora, junta de culata >200.000 km, espárragos de rueda dual por sobrecarga.", "VW 13.180: eléctrica de cabina y embrague urbano; motor y transmisión nobles con aceite al día."], "practicas": [], "checks": [], "fuentes": 12}, match: b => b.cat === 'CAM' && !/MERCEDES|SCANIA/i.test(b.modelo) },

/* ============ Alertas ============ */
function alertasDe(b) {
  const out = [];
  if (b.plan && b.medidor != null && b.plan.ultimo != null) {
    const restante = (b.plan.ultimo + b.plan.intervalo) - b.medidor;
    const u = CATS[b.cat].unidad;
    if (restante <= 0) out.push({ sev: 'crit', txt: 'Service vencido hace ' + fmtN.format(-restante) + ' ' + u });
    else if (restante <= b.plan.intervalo * 0.12) out.push({ sev: 'warn', txt: 'Service en ' + fmtN.format(restante) + ' ' + u });
  }
  b.docs.forEach(d => {
    const dd = dias(d.v);
    if (dd < 0) out.push({ sev: 'crit', txt: d.t + ' vencido el ' + fecha(d.v) });
    else if (dd <= 30) out.push({ sev: 'warn', txt: d.t + ' vence en ' + dd + ' días (' + fecha(d.v) + ')' });
  });
  return out;
}

function vTablero() {
  const conAlerta = BIENES.map(b => ({ b, al: alertasDe(b) })).filter(x => x.al.length);
  const crits = conAlerta.filter(x => x.al.some(a => a.sev === 'crit'));
  const enTaller = BIENES.filter(b => b.estado === 'taller').length;
  const otsAb = OTS.filter(o => o.estado !== 'Cerrada').length;
  const sinSeguro = BIENES.filter(b => !b.docs.length).length;
  const top = conAlerta.sort((a, b2) => (b2.al.some(a2 => a2.sev === 'crit') ? 1 : 0) - (a.al.some(a2 => a2.sev === 'crit') ? 1 : 0)).slice(0, 12);
  return '<h2>Hoy, ' + fecha(HOY) + '</h2>' +
    '<div class="kpis">' +
    kpi(BIENES.length, 'Bienes en el parque') +
    kpi(crits.length, 'Alertas críticas', 'crit') +
    kpi(conAlerta.length - crits.length, 'Por vencer (30 días)', 'warn') +
    kpi(otsAb, 'OTs abiertas', otsAb ? 'warn' : '') +
    kpi(enTaller, 'En taller') +

    '<div class="fgrid"><div class="fcol"><h4>Plan preventivo</h4>' + planHtml +
    '</div><div class="fcol"><h4>Documentación</h4>' +
    (b.docs.length ? b.docs.map(d => {
      const dd = dias(d.v);
      const p = dd < 0 ? '<span class="pill crit">vencido</span>' : dd <= 30 ? '<span class="pill warn">' + dd + ' días</span>' : '<span class="pill ok">vigente</span>';
      return '<div class="doc"><span>' + esc(d.t) + '</span><span class="mono">' + fecha(d.v) + ' &nbsp;' + p + '</span></div>';
    }).join('') : '<p class="note" style="margin:0">Sin documentación con vencimiento informada en el listado.</p>') + '</div></div>' +
    '<h4 style="margin:0;padding:14px 16px 0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Bitácora</h4>' +
    '<ul class="tl">' + (b.bitacora.length ? b.bitacora.map(e =>
      '<li class="' + (e.tipo === 'Falla' ? 'crit' : '') + '">' +
      (e.costo ? '<span class="cost">' + fmt$.format(e.costo) + '</span>' : '') +
      '<div class="when">' + fecha(e.f) + ' · ' + e.tipo + '</div>' +
      '<div>' + esc(e.det) + '</div><div class="by">' + esc(e.por) + '</div></li>').join('') :
      '<li><div class="d" style="color:var(--muted)">Sin registros todavía. Los services, reparaciones, fallas, checklists y lecturas van a ir quedando acá, con responsable y costo.</div></li>') +
    '</ul></div>';
}

/* ============ Wiki técnica ============ */
function vWiki() {
  if (!WIKI.length) return '<h2>Wiki técnica del parque</h2><p class="sub">La investigación sobre sitios especializados está en curso; esta sección se completa con los planes de service, fallas típicas y buenas prácticas de cada familia de equipos.</p>';
  return '<h2>Wiki técnica del parque</h2>' +
    '<p class="sub">Planes de service, fallas típicas y buenas prácticas por familia de equipo, elaborados a partir de manuales del fabricante, foros de operadores y sitios especializados (' + WIKI.reduce((s, w) => s + (w.fuentes || 0), 0) + ' fuentes consultadas). Ajustados a uso severo en demolición.</p>' +
    WIKI.map(w => {
      const n = BIENES.filter(b => w.match(b)).length;
      return '<details class="wk"><summary>' + esc(w.titulo) + '<span class="tag">' + (n ? n + ' en el parque · ' : '') + (w.fuentes || 0) + ' fuentes</span></summary><div class="bd">' +
        (w.plan && w.plan.length ? '<div class="wk-h">Plan de service</div><ul>' + w.plan.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') +
        (w.fallas && w.fallas.length ? '<div class="wk-h">Fallas típicas</div><ul>' + w.fallas.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') +
        (w.practicas && w.practicas.length ? '<div class="wk-h">Buenas prácticas</div><ul>' + w.practicas.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') +
        (w.checks && w.checks.length ? '<div class="wk-h">Checks diarios del operador</div><ul>' + w.checks.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') +
        '</div></details>';
    }).join('');
}

/* ============ Predictivo ============ */
function setUso(cat, v) { usoCat[cat] = parseInt(v, 10) || 0; render(); }
function vPredictivo() {
  const rows = BIENES.filter(b => b.plan && ['MAQ', 'EQU', 'CAM', 'CV', 'AU'].includes(b.cat)).map(b => {
    const u = CATS[b.cat].unidad, uso = usoCat[b.cat] || 0;
    let rest = null, fEst = null;
    if (b.medidor != null && b.plan.ultimo != null) {
      rest = (b.plan.ultimo + b.plan.intervalo) - b.medidor;
      if (uso > 0) fEst = new Date(HOY.getTime() + Math.max(0, Math.round(rest / uso * 30)) * 864e5);
    }
    return { b, u, rest, fEst };
  }).sort((a, b) => (a.fEst ? a.fEst.getTime() : Infinity) - (b.fEst ? b.fEst.getTime() : Infinity));
  const conDato = rows.filter(r => r.fEst);
  return '<h2>Mantenimiento predictivo</h2>' +
    '<p class="sub">Con la última lectura de cada medidor y el uso mensual estimado, el sistema proyecta la fecha del próximo service. La proyección mejora sola a medida que se cargan lecturas (parte de obra y checklist de combustible).</p>' +
    '<h2 style="font-size:14px">Uso mensual estimado por categoría</h2>' +
    '<div class="grid2">' + ['MAQ', 'EQU', 'CAM', 'CV', 'AU'].map(c =>
      '<div class="kpi"><div class="l">' + CATS[c].nombre + ' (' + CATS[c].unidad + '/mes)</div>' +
      '<input class="uso-in" type="number" min="0" value="' + (usoCat[c] || 0) + '" onchange="setUso(\'' + c + '\',this.value)"></div>').join('') + '</div>' +
    '<h2>Proyección del parque</h2>' +
    (conDato.length ? '' : '<p class="sub">Todavía no hay lecturas de medidor cargadas: la tabla muestra el plan de cada bien y se completa con la primera lectura.</p>') +
    '<div class="twrap"><table><thead><tr><th>Interno</th><th>Bien</th><th>Medidor</th><th>Restante</th><th>Fecha estimada</th></tr></thead><tbody>' +
    rows.slice(0, 60).map(({ b, u, rest, fEst }) =>
      '<tr onclick="abrir(\'' + b.id + '\')"><td class="interno">' + b.id + '</td>' +
      '<td>' + esc((b.clas ? b.clas + ' · ' : '') + b.modelo) + '</td>' +
      '<td class="mono">' + (b.medidor != null ? fmtN.format(b.medidor) + ' ' + u : '—') + '</td>' +
      '<td class="mono">' + (rest != null ? (rest <= 0 ? '<span style="color:var(--crit);font-weight:700">vencido</span>' : fmtN.format(rest) + ' ' + u) : 'sin lectura') + '</td>' +
      '<td class="mono">' + (fEst ? fecha(fEst) : '—') + '</td></tr>').join('') +
    '</tbody></table></div>' +
    '<h2>Técnicas predictivas recomendadas</h2><div class="card" style="padding:14px 16px;font-size:13.5px">' + PRED_INFO + '</div>';
}
const PRED_INFO = "La sección se completa con la investigación en curso: análisis de aceite periódico, control de presión de nitrógeno en martillos, inspección de fisuras y telemetría de horómetros.";

/* ============ Taller: cola, producción, indicadores ============ */
function setTT(t) { tallerTab = t; cerrando = null; render(); }
function vTaller() {
  const tabs = [['cola', 'Cola de OTs'], ['produccion', 'Producción'], ['indicadores', 'Indicadores']];
  let bd = '';
  if (tallerTab === 'cola') bd = tallerCola();
  else if (tallerTab === 'produccion') bd = tallerProduccion();
  else bd = tallerIndicadores();
  return '<h2>Taller</h2>' +
    '<div class="subtabs">' + tabs.map(([k, l]) => '<button class="' + (tallerTab === k ? 'on' : '') + '" onclick="setTT(\'' + k + '\')">' + l + '</button>').join('') + '</div>' + bd;
}
function tallerCola() {
  const orden = { 'Pendiente': 0, 'En curso': 1, 'Cerrada': 2 };
  const lista = [...OTS].sort((a, b) => orden[a.estado] - orden[b.estado] || b.f - a.f);
  return '<p class="sub">Cada OT cerrada registra quién la hizo, las horas y el costo — de ahí salen la producción y los indicadores.</p>' +
    '<div class="card">' + (lista.length ? lista.map(o => {
      const b = buscar(o.bien);
      const p = o.estado === 'Pendiente' ? 'crit' : o.estado === 'En curso' ? 'warn' : 'ok';
      const per = PERSONAL.find(x => x.id === o.asignado);
      const btn = o.estado === 'Pendiente' ? '<button class="btn ghost" onclick="avanzar(\'' + o.id + '\')">Iniciar</button>' :
        o.estado === 'En curso' ? '<button class="btn primary" onclick="pedirCierre(\'' + o.id + '\')">Cerrar OT</button>' : '';
      const cierre = cerrando === o.id ?
        '<div class="cierre"><label>Quién la hizo</label><select id="c-per">' + PERSONAL.map(x => '<option value="' + x.id + '">' + x.nombre + ' (' + x.rol + ')</option>').join('') + '</select>' +
        '<label>Horas</label><input id="c-hs" type="number" min="0.5" step="0.5" value="2" style="width:80px">' +
        '<label>Costo repuestos $</label><input id="c-costo" type="number" min="0" value="0" style="width:130px">' +
        '<button class="btn primary" onclick="confirmarCierre(\'' + o.id + '\')">Confirmar cierre</button></div>' : '';
      return '<div class="ot"><span class="id">' + o.id + '</span>' +
        '<div class="what"><b style="cursor:pointer" onclick="abrir(\'' + o.bien + '\')">' + o.bien + (b ? ' · ' + esc(b.modelo) : '') + '</b>' +
        '<div class="d">' + o.tipo + ' · ' + fecha(o.f) + (per ? ' · ' + per.nombre : '') + (o.hs ? ' · ' + o.hs + ' hs' : '') + ' — ' + esc(o.det) + '</div></div>' +
        '<span class="pill ' + p + '">' + o.estado + '</span>' + btn + cierre + '</div>';
    }).join('') : '<div class="ot"><div class="d" style="color:var(--muted)">Sin órdenes de trabajo. Reportá una falla desde <b>Parte de obra</b> o un checklist con fallas y la primera OT aparece acá.</div></div>') + '</div>';
}
function pedirCierre(id) { cerrando = id; render(); }
function confirmarCierre(id) {
  const o = OTS.find(x => x.id === id); if (!o) return;
  o.asignado = $('#c-per').value;
  o.hs = parseFloat($('#c-hs').value) || 0;
  o.costoRep = parseInt($('#c-costo').value, 10) || 0;
  o.estado = 'Cerrada'; o.fCierre = new Date(HOY.getTime());
  const per = PERSONAL.find(x => x.id === o.asignado);
  const b = buscar(o.bien);
  if (b) {
    b.bitacora.unshift({ f: HOY, tipo: o.tipo === 'Preventivo' ? 'Service' : 'Reparación', det: 'Cierre de ' + o.id + ' (' + o.hs + ' hs): ' + o.det, por: 'Taller Mitre · ' + (per ? per.nombre : ''), costo: o.costoRep });
    if (b.estado === 'taller') b.estado = 'operativo';
  }
  cerrando = null;
  toast(o.id + ' cerrada por ' + (per ? per.nombre : 'taller') + ' y registrada en la bitácora de ' + o.bien);
  render();
}
function avanzar(id) {
  const o = OTS.find(x => x.id === id); if (!o) return;
  if (o.estado === 'Pendiente') { o.estado = 'En curso'; toast(o.id + ' iniciada por el taller'); render(); }
}
function tallerProduccion() {
  const cerradas = OTS.filter(o => o.estado === 'Cerrada');
  return '<p class="sub">Producción individual sobre OTs cerradas. Los nombres son de ejemplo: acá van los mecánicos y herreros reales del taller de Munro.</p>' +
    '<div class="twrap"><table><thead><tr><th>Persona</th><th>Rol</th><th>OTs cerradas</th><th>Horas</th><th>Repuestos $</th><th>Hs promedio por OT</th></tr></thead><tbody>' +
    PERSONAL.map(p => {
      const mias = cerradas.filter(o => o.asignado === p.id);
      const hs = mias.reduce((s, o) => s + (o.hs || 0), 0);
      const co = mias.reduce((s, o) => s + (o.costoRep || 0), 0);
      return '<tr><td><b>' + p.nombre + '</b></td><td>' + p.rol + '</td>' +
        '<td class="mono">' + mias.length + '</td><td class="mono">' + hs.toFixed(1) + '</td>' +
        '<td class="mono">' + fmt$.format(co) + '</td><td class="mono">' + (mias.length ? (hs / mias.length).toFixed(1) : '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    (cerradas.length ? '' : '<p class="note">Todavía no hay OTs cerradas: cerrá una desde la Cola (con persona, horas y costo) y la producción aparece acá al instante.</p>');
}
function tallerIndicadores() {
  const cerradas = OTS.filter(o => o.estado === 'Cerrada');
  const totHs = cerradas.reduce((s, o) => s + (o.hs || 0), 0);
  const prev = cerradas.filter(o => o.tipo === 'Preventivo').length;
  const mttr = cerradas.length ? (totHs / cerradas.length) : 0;
  const porBien = {};
  OTS.forEach(o => { (porBien[o.bien] = porBien[o.bien] || []).push(o); });
  const bienes = Object.entries(porBien).sort((a, b) => b[1].length - a[1].length);
  return '<div class="kpis">' +
    kpi(OTS.length, 'OTs totales') +
    kpi(cerradas.length, 'Cerradas', 'ok') +
    kpi(mttr ? mttr.toFixed(1) + ' hs' : '—', 'MTTR (hs por reparación)') +
    kpi(cerradas.length ? Math.round(prev / cerradas.length * 100) + '%' : '—', '% preventivo (típico 45–60, meta >85)') +
    '</div>' +
    '<h2>Por equipo</h2><p class="sub">Equipos con más intervenciones: los primeros candidatos a revisar de fondo o reemplazar. La reincidencia (dos OTs del mismo bien en 30 días) marca reparaciones que no resolvieron la causa raíz.</p>' +
    '<div class="twrap"><table><thead><tr><th>Interno</th><th>OTs</th><th>Horas taller</th><th>Repuestos $</th><th>Reincidencia</th></tr></thead><tbody>' +
    (bienes.length ? bienes.map(([id, ots]) => {
      const hs = ots.reduce((s, o) => s + (o.hs || 0), 0);
      const co = ots.reduce((s, o) => s + (o.costoRep || 0), 0);
      const fechas = ots.map(o => o.f.getTime()).sort();
      let reinc = false;
      for (let i = 1; i < fechas.length; i++) if (fechas[i] - fechas[i - 1] <= 30 * 864e5) reinc = true;
      return '<tr onclick="abrir(\'' + id + '\')"><td class="interno">' + id + '</td><td class="mono">' + ots.length + '</td>' +
        '<td class="mono">' + hs.toFixed(1) + '</td><td class="mono">' + fmt$.format(co) + '</td>' +
        '<td>' + (reinc ? '<span class="pill crit">Sí</span>' : '<span class="pill ok">No</span>') + '</td></tr>';
    }).join('') : '<tr><td colspan="5" style="color:var(--muted)">Sin OTs registradas todavía.</td></tr>') +
    '</tbody></table></div>';
}

/* ============ Checklists ============ */
function setChk(k, v) { if (k === 'tipo') { chkTipo = v; chkEstado = {}; } else chkBien = v; render(); }
function marcarChk(i, val) { chkEstado[i] = chkEstado[i] === val ? null : val; render(); }
function vChecklists() {
  const tpl = CHECKLISTS[chkTipo];
  const opts = BIENES.map(b => '<option value="' + b.id + '"' + (chkBien === b.id ? ' selected' : '') + '>' + b.id + ' · ' + esc((b.clas ? b.clas + ' ' : '') + b.modelo) + '</option>').join('');
  const resp = Object.values(chkEstado).filter(Boolean).length;
  const fallas = tpl.items.filter((x, i) => chkEstado[i] === 'falla');
  return '<h2>Checklists de inspección</h2>' +
    '<p class="sub">Tres momentos de control: cuando el equipo entra al taller, cuando se lo recorre en obra, y en cada carga de combustible con el equipo propio — la carga es la oportunidad perfecta para tomar la lectura del horómetro y mirar niveles.</p>' +
    '<div class="subtabs">' + Object.entries(CHECKLISTS).map(([k, t]) =>
      '<button class="' + (chkTipo === k ? 'on' : '') + '" onclick="setChk(\'tipo\',\'' + k + '\')">' + t.titulo + '</button>').join('') + '</div>' +
    '<div class="filters"><select onchange="setChk(\'bien\',this.value)"><option value="">Elegí el equipo…</option>' + opts + '</select>' +
    (tpl.lectura ? '<input id="chk-lect" type="number" min="0" placeholder="Lectura horómetro / km">' : '') + '</div>' +
    '<div class="card">' + tpl.items.map((it, i) =>
      '<div class="chk-row"><span>' + it + '</span><span class="seg3">' +
      '<button class="ok' + (chkEstado[i] === 'ok' ? ' on' : '') + '" onclick="marcarChk(' + i + ',\'ok\')">OK</button>' +
      '<button class="falla' + (chkEstado[i] === 'falla' ? ' on' : '') + '" onclick="marcarChk(' + i + ',\'falla\')">Falla</button>' +
      '<button class="na' + (chkEstado[i] === 'na' ? ' on' : '') + '" onclick="marcarChk(' + i + ',\'na\')">N/A</button>' +
      '</span></div>').join('') + '</div>' +
    '<div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">' +
    '<label style="font-size:13px"><input type="checkbox" id="chk-ots"' + (chkOTs ? ' checked' : '') + ' onchange="chkOTs=this.checked"> Crear una OT por cada ítem en falla</label>' +
    '<button class="btn primary" onclick="guardarChk()">Guardar checklist (' + resp + '/' + tpl.items.length + ')</button>' +
    (fallas.length ? '<span class="pill crit">' + fallas.length + ' en falla</span>' : '') + '</div>';
}
function guardarChk() {
  const b = buscar(chkBien);
  if (!b) { toast('Elegí primero el equipo del checklist.'); return; }
  const tpl = CHECKLISTS[chkTipo];
  const oks = tpl.items.filter((x, i) => chkEstado[i] === 'ok').length;
  const fallas = tpl.items.map((x, i) => chkEstado[i] === 'falla' ? x : null).filter(Boolean);
  if (!oks && !fallas.length) { toast('Marcá al menos un ítem antes de guardar.'); return; }
  const lectEl = $('#chk-lect');
  if (lectEl && lectEl.value) {
    const v = parseInt(lectEl.value, 10);
    if (isFinite(v) && (b.medidor == null || v >= b.medidor)) {
      b.medidor = v;
      if (b.plan && b.plan.ultimo == null) b.plan.ultimo = v;
    }
  }
  b.bitacora.unshift({ f: HOY, tipo: 'Checklist', det: tpl.titulo + ': ' + oks + ' OK' + (fallas.length ? ', ' + fallas.length + ' en falla (' + fallas.join('; ') + ')' : ', sin fallas'), por: 'Checklist de ' + tpl.titulo.toLowerCase(), costo: 0 });
  let n = 0;
  if (chkOTs) fallas.forEach(f => {
    OTS.unshift({ id: 'OT-' + String(otSeq++).padStart(4, '0'), bien: b.id, tipo: 'Correctivo', det: 'Checklist ' + tpl.titulo.toLowerCase() + ': ' + f, estado: 'Pendiente', f: HOY });
    n++;
  });
  chkEstado = {};
  toast('Checklist guardado en la bitácora de ' + b.id + (n ? '. Se crearon ' + n + ' OT(s).' : '.'));
  render();
}

/* ============ Parte de obra ============ */
function vObra() {
  const opts = BIENES.map(b => '<option value="' + b.id + '">' + b.id + ' · ' + esc((b.clas ? b.clas + ' ' : '') + b.modelo) + '</option>').join('');
  return '<h2>Parte diario desde la obra</h2>' +
    '<p class="sub">Así lo ve un operador o capataz en el celular: 30 segundos para informar horas o avisar una falla.</p>' +
    '<div class="phone"><div class="ph-head">MITRE · Parte de obra<small>' + fecha(HOY) + '</small></div>' +
    '<form onsubmit="enviarParte(event)">' +
    '<div><label for="p-bien">Equipo</label><select id="p-bien">' + opts + '</select></div>' +
    '<div class="seg"><button type="button" class="' + (modoParte === 'lectura' ? 'on' : '') + '" onclick="modoParte=\'lectura\';render()">Cargar horas / km</button>' +
    '<button type="button" class="' + (modoParte === 'falla' ? 'on' : '') + '" onclick="modoParte=\'falla\';render()">Reportar falla</button></div>' +
    (modoParte === 'lectura'
      ? '<div><label for="p-lect">Lectura del horómetro u odómetro</label><input id="p-lect" type="number" min="0" placeholder="ej. 11.310" required></div>'
      : '<div><label for="p-det">Qué pasó</label><textarea id="p-det" rows="3" placeholder="ej. Pérdida de hidráulico en el brazo, la máquina quedó parada" required></textarea></div>') +
    '<button class="btn primary" type="submit">' + (modoParte === 'lectura' ? 'Enviar lectura' : 'Enviar reporte de falla') + '</button>' +
    '</form></div>' +
    '<p class="note" style="text-align:center">Una lectura actualiza el medidor y activa el predictivo.<br>Una falla crea automáticamente una OT en la cola del taller.</p>';
}
function enviarParte(ev) {
  ev.preventDefault();
  const b = buscar($('#p-bien').value); if (!b) return;
  if (modoParte === 'lectura') {
    const v = parseInt($('#p-lect').value, 10);
    if (!isFinite(v) || (b.medidor != null && v < b.medidor)) { toast('La lectura debe ser mayor a la actual (' + fmtN.format(b.medidor) + ')'); return; }
    b.medidor = v;
    let extra = '';
    if (b.plan && b.plan.ultimo == null) { b.plan.ultimo = v; extra = ' Se tomó como punto de partida del plan de service.'; }
    b.bitacora.unshift({ f: HOY, tipo: 'Lectura', det: 'Lectura ' + fmtN.format(v) + ' ' + (CATS[b.cat].unidad || '') + ' (parte de obra)', por: 'Parte de obra', costo: 0 });
    toast('Lectura cargada en la bitácora de ' + b.id + '.' + extra);
  } else {
    const det = $('#p-det').value.trim(); if (!det) return;
    const ot = { id: 'OT-' + String(otSeq++).padStart(4, '0'), bien: b.id, tipo: 'Correctivo', det, estado: 'Pendiente', f: HOY };
    OTS.unshift(ot);
    b.bitacora.unshift({ f: HOY, tipo: 'Falla', det: 'Reporte desde obra: ' + det, por: 'Parte de obra', costo: 0 });
    toast('Falla reportada. Se creó la ' + ot.id + ' en la cola del taller.');
  }
  render();
}

/* ============ Render ============ */
function render() {
  nav();
  const app = $('#app');
  if (fichaId) { app.innerHTML = vFicha(buscar(fichaId)); return; }
  app.innerHTML = vista === 'tablero' ? vTablero() : vista === 'parque' ? vParque() :
    vista === 'wiki' ? vWiki() : vista === 'predictivo' ? vPredictivo() :
    vista === 'taller' ? vTaller() : vista === 'checklists' ? vChecklists() : vObra();
  if (vista === 'parque') { const inp = $('.filters input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
}
render();
</script>
