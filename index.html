<title>Parque Mitre</title>
<style>
  :root{
    --bg:#F2F0EB; --surface:#FFFFFF; --surface2:#EAE7DE; --ink:#23211C; --muted:#6E6A5F;
    --line:#DBD6C9; --accent:#F5A800; --accent-ink:#8A6100; --on-accent:#1C1B14;
    --ok:#2E7D4F; --ok-bg:#E2EFE7; --warn:#8A6100; --warn-bg:#F7ECD2; --crit:#B03A20; --crit-bg:#F6E2DC;

  }

    :root:not([data-theme="light"]){
      --bg:#1B1A15; --surface:#24221B; --surface2:#2D2A21; --ink:#EFECE2; --muted:#A6A090;
      --line:#3B372B; --accent:#F5A800; --accent-ink:#F2BB3F; --on-accent:#1C1B14;
      --ok:#63BD8C; --ok-bg:#22352A; --warn:#E3AC3F; --warn-bg:#3A3323; --crit:#E27052; --crit-bg:#402620;
      --chip:#2D2A21; --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1A15; --surface:#24221B; --surface2:#2D2A21; --ink:#EFECE2; --muted:#A6A090;
    --line:#3B372B; --accent:#F5A800; --accent-ink:#F2BB3F; --on-accent:#1C1B14;

  .hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,#1C1B14 14px 28px)}
  header{background:var(--surface);border-bottom:1px solid var(--line)}
  .head-in{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{background:var(--accent);color:var(--on-accent);font-weight:800;letter-spacing:.08em;
    padding:6px 10px;font-size:15px}
  .head-t h1{margin:0;font-size:19px;letter-spacing:.01em}
  .head-t p{margin:0;color:var(--muted);font-size:12.5px}
  .demo-tag{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    border:1px dashed var(--line);padding:3px 8px;border-radius:3px}
  nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .nav-in{max-width:1100px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
  .nav-in button{
    appearance:none;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;
    padding:11px 14px 9px;font:600 13.5px/1 inherit;font-family:inherit;color:var(--muted);white-space:nowrap}
  .nav-in button.on{color:var(--ink);border-bottom-color:var(--accent)}
  .nav-in button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
  h2{font-size:16px;margin:26px 0 10px;letter-spacing:.01em}
  h2:first-child{margin-top:0}
  .sub{color:var(--muted);font-size:13px;margin:-6px 0 14px}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:var(--shadow)}

  .kpi.crit .n{color:var(--crit)} .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--ok)}

  .alert-row{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}

  .sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
  .sev.crit{background:var(--crit)} .sev.warn{background:var(--accent)}
  .alert-row b{font-size:14px}
  .alert-row .d{color:var(--muted);font-size:12.5px}
  .alert-row .who{margin-left:auto;text-align:right;flex:none}
  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:99px}
  .pill.crit{background:var(--crit-bg);color:var(--crit)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.na{background:var(--chip);color:var(--muted)}
  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filters select,.filters input,select,input,textarea{
    background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    padding:8px 10px;font:14px inherit;font-family:inherit}
  .filters input{flex:1;min-width:160px}
  select:focus-visible,input:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  /* table */
  .twrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
  th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;

  tbody tr{cursor:pointer}

  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12.5px}
  .interno{font-weight:700}

  .meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}

  .fcol{padding:16px;border-top:1px solid var(--line)}

  .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
  .bar i.warn{background:var(--accent)} .bar i.crit{background:var(--crit)}
  .doc{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .doc:last-child{border-bottom:none}
  /* timeline */
  .tl{list-style:none;margin:0;padding:0 16px 16px;border-top:1px solid var(--line)}
  .tl li{position:relative;padding:12px 0 12px 26px;border-bottom:1px dashed var(--line)}
  .tl li:last-child{border-bottom:none}
  .tl li::before{content:"";position:absolute;left:6px;top:19px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:2px solid var(--surface)}
  .tl li.crit::before{background:var(--crit)}
  .tl .when{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tl .cost{float:right;font-variant-numeric:tabular-nums;font-weight:600}
  .tl .by{color:var(--muted);font-size:12.5px}
  /* OTs */
  .ot{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .ot:first-child{border-top:none}
  .ot .id{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:13px}
  .ot .what{flex:1;min-width:200px}
  .ot .what .d{color:var(--muted);font-size:12.5px}
  .btn{appearance:none;border:none;border-radius:5px;padding:9px 14px;font:600 13.5px inherit;font-family:inherit;cursor:pointer}
  .btn.primary{background:var(--accent);color:var(--on-accent)}
  .btn.ghost{background:var(--chip);color:var(--ink)}
  .btn:hover{filter:brightness(.96)}
  /* obra (parte móvil) */
  .phone{max-width:390px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;

  .phone .ph-head{background:var(--accent);color:var(--on-accent);padding:12px 16px;font-weight:800}
  .phone .ph-head small{display:block;font-weight:600;opacity:.75}
  .phone form{padding:16px;display:flex;flex-direction:column;gap:12px}
  .phone label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{flex:1;border:none;background:var(--surface);padding:9px;font:600 13px inherit;font-family:inherit;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  textarea{width:100%;resize:vertical}
  input[type=number],select{width:100%}
  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:6px;font-size:14px;
    pointer-events:none;transition:all .25s;max-width:90vw;z-index:20}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){#toast{transition:none}}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px}
</style>

<script>

const dias = d => Math.floor((d - HOY) / 864e5);

      { f: new Date(2026, 6, 22), tipo: 'Service', det: 'Service 2.200 hs según plan Brokk: hidráulico y eléctrico', por: 'Brokk Argentina (servicio oficial)', costo: 3400000 },

/* Resto del parque, generado en forma determinística hasta 156 bienes */
(function generarParque() {
  const keys = Object.keys(CATS);
  const cant = { EX: 26, CF: 14, BK: 6, RD: 22, GE: 18, CM: 32, CV: 38 };
  const usados = {}; BIENES.forEach(b => { usados[b.cat] = (usados[b.cat] || 0) + 1; });
  keys.forEach(k => {
    const c = CATS[k];
    for (let i = (usados[k] || 0); i < cant[k]; i++) {
      const seed = (k.charCodeAt(0) * 31 + k.charCodeAt(1) * 17 + i * 7919) % 1000;
      const esKm = c.unidad === 'km';
      const medidor = esKm ? 40000 + seed * 180 : 1200 + seed * 14;
      const intervalo = esKm ? (k === 'CM' ? 15000 : 10000) : (k === 'BK' || k === 'RD' ? 250 : k === 'GE' ? 400 : 500);
      const desde = Math.round(intervalo * (0.1 + (seed % 83) / 100)); // consumido desde el último service
      const estado = seed % 19 === 0 ? 'taller' : seed % 11 === 0 ? 'alquilado' : 'operativo';
      const venc = new Date(2026, 7 + (seed % 11), 1 + (seed % 27));
      BIENES.push({
        id: k + '-' + String(i + 1).padStart(3, '0'), cat: k,
        modelo: c.marcas[seed % c.marcas.length], anio: 2014 + (seed % 11),
        obra: OBRAS[seed % OBRAS.length], estado, medidor,
        plan: { intervalo, ultimo: medidor - desde },
        docs: [{ t: esKm ? 'VTV' : 'Seguro técnico', v: venc }],
        bitacora: [{ f: new Date(2026, 6, 1 + (seed % 28)), tipo: 'Service',
          det: 'Service según plan (' + fmtN.format(medidor - desde) + ' ' + c.unidad + ')',
          por: 'Taller Mitre', costo: 250000 + (seed % 9) * 90000 }],
      });
    }
  });
})();

let OTS = [
  { id: 'OT-0231', bien: 'CF-003', tipo: 'Correctivo', det: 'Recalentamiento de transmisión. Desarme, diagnóstico y reparación.', estado: 'En curso', f: new Date(2026, 7, 6) },
  { id: 'OT-0230', bien: 'CM-021', tipo: 'Preventivo', det: 'Turno de VTV antes del 20/08. Coordinar con logística.', estado: 'Pendiente', f: new Date(2026, 7, 10) },
  { id: 'OT-0229', bien: 'EX-007', tipo: 'Preventivo', det: 'Service 11.200 hs vencido. Programar en obra COTO con lubricador móvil.', estado: 'Pendiente', f: new Date(2026, 7, 9) },
  { id: 'OT-0227', bien: 'GE-004', tipo: 'Correctivo', det: 'Recarga y reposición de matafuegos vencidos en sala de grupo.', estado: 'Pendiente', f: new Date(2026, 7, 8) },
  { id: 'OT-0224', bien: 'BK-002', tipo: 'Preventivo', det: 'Service 2.200 hs con servicio oficial Brokk.', estado: 'Cerrada', f: new Date(2026, 6, 22) },
];
let otSeq = 232;

/* ============ Lógica de alertas ============ */
function alertasDe(b) {
  const out = [];
  const restante = (b.plan.ultimo + b.plan.intervalo) - b.medidor;
  const u = CATS[b.cat].unidad;
  if (restante <= 0) out.push({ sev: 'crit', txt: 'Service vencido hace ' + fmtN.format(-restante) + ' ' + u });
  else if (restante <= b.plan.intervalo * 0.12) out.push({ sev: 'warn', txt: 'Service en ' + fmtN.format(restante) + ' ' + u });
  b.docs.forEach(d => {
    const dd = dias(d.v);
    if (dd < 0) out.push({ sev: 'crit', txt: d.t + ' vencido el ' + fecha(d.v) });
    else if (dd <= 30) out.push({ sev: 'warn', txt: d.t + ' vence en ' + dd + ' días (' + fecha(d.v) + ')' });
  });
  return out;
}
const buscar = id => BIENES.find(b => b.id === id);

/* ============ Navegación ============ */
const VISTAS = [['tablero', 'Tablero'], ['parque', 'Parque'], ['taller', 'Taller / OTs'], ['obra', 'Parte de obra']];
let vista = 'tablero', fichaId = null;
const filtros = { cat: '', estado: '', obra: '', q: '' };

function nav() {
  $('#nav').innerHTML = VISTAS.map(([k, l]) =>
    '<button class="' + (vista === k && !fichaId ? 'on' : '') + '" onclick="ir(\'' + k + '\')">' + l + '</button>').join('');
}
function ir(v) { vista = v; fichaId = null; render(); }
function abrir(id) { fichaId = id; render(); window.scrollTo(0, 0); }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ============ Vistas ============ */
function vTablero() {
  const conAlerta = BIENES.map(b => ({ b, al: alertasDe(b) })).filter(x => x.al.length);
  const crits = conAlerta.filter(x => x.al.some(a => a.sev === 'crit'));
  const enTaller = BIENES.filter(b => b.estado === 'taller').length;
  const gasto = BIENES.flatMap(b => b.bitacora).filter(e => (HOY - e.f) / 864e5 <= 30)
    .reduce((s, e) => s + e.costo, 0);
  const top = conAlerta.sort((a, b2) => (b2.al.some(a2 => a2.sev === 'crit') ? 1 : 0) - (a.al.some(a2 => a2.sev === 'crit') ? 1 : 0)).slice(0, 9);
  return '<h2>Hoy, ' + fecha(HOY) + '</h2>' +
    '<div class="kpis">' +
    kpi(BIENES.length, 'Bienes en el parque') +
    kpi(crits.length, 'Alertas críticas', 'crit') +
    kpi(conAlerta.length - crits.length, 'Por vencer (30 días)', 'warn') +
    kpi(enTaller, 'En taller') +
    kpi(fmt$.format(gasto), 'Gasto últimos 30 días') +
    '</div>' +
    '<h2>Requiere atención</h2><p class="sub">Services vencidos o próximos y documentación por vencer. Tocá una fila para abrir la ficha.</p>' +
    '<div class="card">' + top.map(({ b, al }) => {
      const a = al[0];
      return '<div class="alert-row" onclick="abrir(\'' + b.id + '\')">' +
        '<span class="sev ' + a.sev + '"></span>' +
        '<div><b>' + b.id + ' · ' + b.modelo + '</b><div class="d">' + al.map(x => x.txt).join(' · ') + '</div></div>' +
        '<div class="who"><span class="pill na">' + b.obra + '</span></div></div>';
    }).join('') + '</div>' +
    '<p class="note">Mostrando 9 de ' + conAlerta.length + ' bienes con avisos. El listado completo está en <b>Parque</b>.</p>';
}
function kpi(n, l, cls) {
  return '<div class="kpi ' + (cls || '') + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
}

function vParque() {
  const opc = (arr, sel) => arr.map(([v, l]) => '<option value="' + v + '"' + (sel === v ? ' selected' : '') + '>' + l + '</option>').join('');
  const lista = BIENES.filter(b =>
    (!filtros.cat || b.cat === filtros.cat) &&
    (!filtros.estado || b.estado === filtros.estado) &&
    (!filtros.obra || b.obra === filtros.obra) &&
    (!filtros.q || (b.id + ' ' + b.modelo).toLowerCase().includes(filtros.q.toLowerCase())));
  return '<h2>Parque de bienes</h2><p class="sub">' + lista.length + ' de ' + BIENES.length + ' bienes</p>' +
    '<div class="filters">' +
    '<select onchange="setF(\'cat\',this.value)"><option value="">Todas las categorías</option>' +
    opc(Object.entries(CATS).map(([k, c]) => [k, c.nombre + 's']), filtros.cat) + '</select>' +
    '<select onchange="setF(\'estado\',this.value)"><option value="">Todos los estados</option>' +
    opc([['operativo', 'Operativo'], ['taller', 'En taller'], ['alquilado', 'Alquilado']], filtros.estado) + '</select>' +
    '<select onchange="setF(\'obra\',this.value)"><option value="">Todas las obras</option>' +
    opc(OBRAS.map(o => [o, o]), filtros.obra) + '</select>' +
    '<input placeholder="Buscar por interno o modelo… (ej. EX-007)" value="' + filtros.q + '" oninput="setF(\'q\',this.value)">' +
    '</div>' +
    '<div class="twrap"><table><thead><tr><th>Interno</th><th>Bien</th><th>Obra / ubicación</th>' +
    '<th>Medidor</th><th>Próx. service</th><th>Estado</th></tr></thead><tbody>' +
    lista.slice(0, 60).map(b => {
      const u = CATS[b.cat].unidad, rest = (b.plan.ultimo + b.plan.intervalo) - b.medidor;
      const al = alertasDe(b);
      const est = b.estado === 'taller' ? '<span class="pill warn">En taller</span>' :
        al.some(a => a.sev === 'crit') ? '<span class="pill crit">Crítico</span>' :
        al.length ? '<span class="pill warn">Aviso</span>' :
        b.estado === 'alquilado' ? '<span class="pill na">Alquilado</span>' : '<span class="pill ok">Operativo</span>';
      return '<tr onclick="abrir(\'' + b.id + '\')"><td class="interno">' + b.id + '</td>' +
        '<td>' + b.modelo + ' <span class="mono" style="color:var(--muted)">' + b.anio + '</span></td>' +
        '<td>' + b.obra + '</td>' +
        '<td class="mono">' + fmtN.format(b.medidor) + ' ' + u + '</td>' +
        '<td class="mono">' + (rest <= 0 ? '<span style="color:var(--crit);font-weight:700">vencido</span>' : 'en ' + fmtN.format(rest) + ' ' + u) + '</td>' +
        '<td>' + est + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    (lista.length > 60 ? '<p class="note">Mostrando los primeros 60 resultados; afiná los filtros para ver el resto.</p>' : '');
}
function setF(k, v) { filtros[k] = v; render(); }

function vFicha(b) {
  const u = CATS[b.cat].unidad, al = alertasDe(b);
  const prox = b.plan.ultimo + b.plan.intervalo, rest = prox - b.medidor;
  const pct = Math.min(100, Math.round((b.medidor - b.plan.ultimo) / b.plan.intervalo * 100));
  const cls = rest <= 0 ? 'crit' : rest <= b.plan.intervalo * 0.12 ? 'warn' : '';
  const total = b.bitacora.reduce((s, e) => s + e.costo, 0);
  return '<button class="back" onclick="ir(\'' + (vista === 'tablero' ? 'tablero' : 'parque') + '\')">&larr; Volver</button>' +
    '<div class="card"><div class="ficha-head">' +
    '<div class="ic">' + b.cat + '</div>' +
    '<div><h3>' + b.id + ' · ' + b.modelo + '</h3>' +
    '<div class="meta"><span>' + CATS[b.cat].nombre + ' · ' + b.anio + '</span><span>' + b.obra + '</span>' +
    '<span class="mono">' + fmtN.format(b.medidor) + ' ' + u + '</span>' +
    '<span>Mantenimiento acumulado: <b>' + fmt$.format(total) + '</b></span></div>' +
    (al.length ? '<div style="margin-top:8px">' + al.map(a => '<span class="pill ' + a.sev + '" style="margin-right:6px">' + a.txt + '</span>').join('') + '</div>' : '') +
    '</div></div>' +
    '<div class="fgrid"><div class="fcol"><h4>Plan preventivo</h4>' +
    '<div class="plan"><div class="row"><span>Service cada ' + fmtN.format(b.plan.intervalo) + ' ' + u + '</span>' +
    '<span class="mono">' + (rest <= 0 ? 'vencido hace ' + fmtN.format(-rest) + ' ' + u : 'faltan ' + fmtN.format(rest) + ' ' + u) + '</span></div>' +
    '<div class="bar"><i class="' + cls + '" style="width:' + pct + '%"></i></div>' +
    '<div class="row" style="margin-top:4px;color:var(--muted);font-size:12px"><span>último: ' + fmtN.format(b.plan.ultimo) + ' ' + u + '</span><span>próximo: ' + fmtN.format(prox) + ' ' + u + '</span></div></div>' +
    '</div><div class="fcol"><h4>Documentación</h4>' +
    b.docs.map(d => {
      const dd = dias(d.v);
      const p = dd < 0 ? '<span class="pill crit">vencido</span>' : dd <= 30 ? '<span class="pill warn">' + dd + ' días</span>' : '<span class="pill ok">vigente</span>';
      return '<div class="doc"><span>' + d.t + '</span><span class="mono">' + fecha(d.v) + ' &nbsp;' + p + '</span></div>';
    }).join('') + '</div></div>' +
    '<h4 style="margin:0;padding:14px 16px 0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Bitácora</h4>' +
    '<ul class="tl">' + b.bitacora.map(e =>
      '<li class="' + (e.tipo === 'Falla' ? 'crit' : '') + '">' +
      (e.costo ? '<span class="cost">' + fmt$.format(e.costo) + '</span>' : '') +
      '<div class="when">' + fecha(e.f) + ' · ' + e.tipo + '</div>' +
      '<div>' + e.det + '</div><div class="by">' + e.por + '</div></li>').join('') +
    '</ul></div>';
}

function vTaller() {
  const orden = { 'Pendiente': 0, 'En curso': 1, 'Cerrada': 2 };
  const lista = [...OTS].sort((a, b) => orden[a.estado] - orden[b.estado] || b.f - a.f);
  return '<h2>Órdenes de trabajo</h2><p class="sub">El taller trabaja sobre esta cola. Cada OT cerrada queda registrada en la bitácora del bien.</p>' +
    '<div class="card">' + lista.map(o => {
      const b = buscar(o.bien);
      const p = o.estado === 'Pendiente' ? 'crit' : o.estado === 'En curso' ? 'warn' : 'ok';
      const btn = o.estado === 'Pendiente' ? '<button class="btn ghost" onclick="avanzar(\'' + o.id + '\')">Iniciar</button>' :
        o.estado === 'En curso' ? '<button class="btn primary" onclick="avanzar(\'' + o.id + '\')">Cerrar OT</button>' : '';
      return '<div class="ot"><span class="id">' + o.id + '</span>' +
        '<div class="what"><b style="cursor:pointer" onclick="abrir(\'' + o.bien + '\')">' + o.bien + (b ? ' · ' + b.modelo : '') + '</b>' +
        '<div class="d">' + o.tipo + ' · ' + fecha(o.f) + ' — ' + o.det + '</div></div>' +
        '<span class="pill ' + p + '">' + o.estado + '</span>' + btn + '</div>';
    }).join('') + '</div>';
}
function avanzar(id) {
  const o = OTS.find(x => x.id === id); if (!o) return;
  if (o.estado === 'Pendiente') { o.estado = 'En curso'; toast(o.id + ' iniciada por el taller'); }
  else if (o.estado === 'En curso') {
    o.estado = 'Cerrada';
    const b = buscar(o.bien);
    if (b) {
      b.bitacora.unshift({ f: HOY, tipo: 'Reparación', det: 'Cierre de ' + o.id + ': ' + o.det, por: 'Taller Mitre', costo: 0 });
      if (b.estado === 'taller') b.estado = 'operativo';
    }
    toast(o.id + ' cerrada y registrada en la bitácora de ' + o.bien);
  }
  render();
}

let modoParte = 'lectura';
function vObra() {
  const opts = BIENES.slice(0, 40).map(b => '<option value="' + b.id + '">' + b.id + ' · ' + b.modelo + '</option>').join('');
  return '<h2>Parte diario desde la obra</h2>' +
    '<p class="sub">Así lo ve un operador o capataz en el celular: 30 segundos para informar horas o avisar una falla.</p>' +
    '<div class="phone"><div class="ph-head">MITRE · Parte de obra<small>' + fecha(HOY) + '</small></div>' +
    '<form onsubmit="enviarParte(event)">' +
    '<div><label for="p-bien">Equipo</label><select id="p-bien">' + opts + '</select></div>' +
    '<div class="seg"><button type="button" class="' + (modoParte === 'lectura' ? 'on' : '') + '" onclick="modoParte=\'lectura\';render()">Cargar horas / km</button>' +
    '<button type="button" class="' + (modoParte === 'falla' ? 'on' : '') + '" onclick="modoParte=\'falla\';render()">Reportar falla</button></div>' +
    (modoParte === 'lectura'
      ? '<div><label for="p-lect">Lectura del horómetro u odómetro</label><input id="p-lect" type="number" min="0" placeholder="ej. 11.310" required></div>'
      : '<div><label for="p-det">Qué pasó</label><textarea id="p-det" rows="3" placeholder="ej. Pérdida de hidráulico en el brazo, la máquina quedó parada" required></textarea></div>') +
    '<button class="btn primary" type="submit">' + (modoParte === 'lectura' ? 'Enviar lectura' : 'Enviar reporte de falla') + '</button>' +
    '</form></div>' +
    '<p class="note" style="text-align:center">Una lectura actualiza el medidor y puede disparar la alerta de service.<br>Una falla crea automáticamente una OT en la cola del taller.</p>';
}
function enviarParte(ev) {
  ev.preventDefault();
  const b = buscar($('#p-bien').value); if (!b) return;
  if (modoParte === 'lectura') {
    const v = parseInt($('#p-lect').value, 10);
    if (!isFinite(v) || v < b.medidor) { toast('La lectura debe ser mayor a la actual (' + fmtN.format(b.medidor) + ')'); return; }
    b.medidor = v;
    b.bitacora.unshift({ f: HOY, tipo: 'Lectura', det: 'Lectura ' + fmtN.format(v) + ' ' + CATS[b.cat].unidad + ' (parte de obra)', por: 'Parte de obra', costo: 0 });
    const rest = (b.plan.ultimo + b.plan.intervalo) - b.medidor;
    toast(rest <= 0 ? 'Lectura cargada. ¡Atención: el service de ' + b.id + ' quedó vencido!' : 'Lectura cargada en la bitácora de ' + b.id);
  } else {
    const det = $('#p-det').value.trim(); if (!det) return;
    const ot = { id: 'OT-0' + (otSeq++), bien: b.id, tipo: 'Correctivo', det, estado: 'Pendiente', f: HOY };
    OTS.unshift(ot);
    b.bitacora.unshift({ f: HOY, tipo: 'Falla', det: 'Reporte desde obra: ' + det, por: 'Parte de obra', costo: 0 });
    toast('Falla reportada. Se creó la ' + ot.id + ' en la cola del taller.');
  }
  render();
}

function render() {
  nav();
  const app = $('#app');
  if (fichaId) { app.innerHTML = vFicha(buscar(fichaId)); return; }
  app.innerHTML = vista === 'tablero' ? vTablero() : vista === 'parque' ? vParque() :
    vista === 'taller' ? vTaller() : vObra();
  if (vista === 'parque') { const inp = $('.filters input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
}
render();
</script>
